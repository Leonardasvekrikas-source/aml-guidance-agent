# Corpus manifest.
#
# Every document is public regulatory or typology guidance, downloadable
# without registration. The PDFs themselves are not committed; this file plus
# src/aml_agent/ingest/download.py reproduces the corpus from scratch.
#
# Each entry was link-verified by fetching the URL and confirming the bytes
# served were the stated document. Publication dates were checked against the
# publisher's own record rather than the PDF creation timestamp, which is
# frequently a later re-save and would misdate the edition.
#
# retrieval_date is recorded per ingestion run in the documents table rather
# than here, because it changes every time the corpus is rebuilt.

